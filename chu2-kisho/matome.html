<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const fb = (w, px) => `${w ? w + ' ' : ''}${px}px ` + css('--font-body');
  const fn = (w, px) => `${w ? w + ' ' : ''}${px}px ` + css('--font-num');
  const NAV = window.UNIT_NAV || [];
  const CH = Object.fromEntries(NAV.slice(1).map(([label, href]) => [label[0], [label.slice(2), href]]));
  const r1 = (v) => Math.round(v * 10) / 10;
  const f1 = (v) => r1(v).toFixed(1);

  // ---------- 共通の部品（各章と同じ） ----------
  const BEAUFORT = [0.3, 1.6, 3.4, 5.5, 8.0, 10.8, 13.9, 17.2, 20.8, 24.5, 28.5, 32.7];
  const beaufort = (ms) => { let f = 0; while (f < BEAUFORT.length && ms >= BEAUFORT[f]) f++; return f; };
  const DIRS = ['北', '北北東', '北東', '東北東', '東', '東南東', '南東', '南南東', '南', '南南西', '南西', '西南西', '西', '西北西', '北西', '北北西'];
  const DIRS8 = ['北', '北東', '東', '南東', '南', '南西', '西', '北西'];
  const bearingFrom = (vx, vy) => { let b = Math.atan2(-vx, vy) * 180 / Math.PI; if (b < 0) b += 360; return b; };
  const dir16 = (b) => DIRS[Math.round(b / 22.5) % 16];
  const dir8 = (b) => DIRS8[Math.round(b / 45) % 8];
  const WX_LABEL = { fine: '晴れ', cloudy: 'くもり', rain: '雨', snow: '雪' };
  function drawSymbol(ctx, x, y, size, wx, bearing, force) {
    const ink = css('--ink');
    ctx.save();
    ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineWidth = Math.max(1.5, size * 0.06); ctx.lineCap = 'round';
    const R = size * 0.22;
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2);
    if (wx === 'rain') ctx.fill(); else ctx.stroke();
    if (wx === 'fine') { ctx.beginPath(); ctx.moveTo(x, y - R); ctx.lineTo(x, y + R); ctx.stroke(); }
    if (wx === 'cloudy') { ctx.beginPath(); ctx.arc(x, y, R * 0.55, 0, Math.PI * 2); ctx.stroke(); }
    if (force > 0) {
      const b = bearing * Math.PI / 180, dx = Math.sin(b), dy = -Math.cos(b), L = size * 0.9;
      ctx.beginPath(); ctx.moveTo(x + dx * R, y + dy * R); ctx.lineTo(x + dx * (R + L), y + dy * (R + L)); ctx.stroke();
      let fx = -dy * 0.85 + dx * 0.5, fy = dx * 0.85 + dy * 0.5; const fl = Math.hypot(fx, fy); fx /= fl; fy /= fl;
      const fd = 2 * (fx * dx + fy * dy), gx = fd * dx - fx, gy = fd * dy - fy;   // 左側（右側を線で折り返す）
      // 日本式（気象庁 wm2.pdf）：風力 6 までは右側に、7 以上は右側 6 本＋左側に（風力−6）本を先端から
      for (let i = 0; i < force; i++) { const t = L - (i % 6) * size * 0.13, ux = i < 6 ? fx : gx, uy = i < 6 ? fy : gy; const px = x + dx * (R + t), py = y + dy * (R + t); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + ux * size * 0.3, py + uy * size * 0.3); ctx.stroke(); }
    }
    ctx.restore();
  }
  function arrow(ctx, x1, y1, x2, y2, color, width) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy); if (L < 1) return;
    const nx = dx / L, ny = dy / L;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - nx * 6, y2 - ny * 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - nx * 10 - ny * 5, y2 - ny * 10 + nx * 5); ctx.lineTo(x2 - nx * 10 + ny * 5, y2 - ny * 10 - nx * 5); ctx.closePath(); ctx.fill();
  }
  // 前線の記号（4章・5章と同じ形）。入試の図と同じく墨一色で描く（色で前線の種類がわかってしまうため）
  function frontLine(ctx, x1, y1, x2, y2, kind, k0 = 0) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), nx = dx / L, ny = dy / L, ink = css('--ink');
    ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const ang = Math.atan2(ny, nx), side = kind === 'stationary' ? -1 : 1;
    let k = k0;
    for (let s = 14; s < L - 6; s += 22, k++) {
      const bx = x1 + nx * s, by = y1 + ny * s, type = kind === 'stationary' ? (k % 2 === 0 ? 'warm' : 'cold') : kind;
      ctx.beginPath();
      if (type === 'warm') { ctx.arc(bx, by, 6, ang, ang + Math.PI, true); ctx.fill(); }
      else { ctx.moveTo(bx - nx * 6, by - ny * 6); ctx.lineTo(bx + side * ny * 10, by - side * nx * 10); ctx.lineTo(bx + nx * 6, by + ny * 6); ctx.closePath(); ctx.fill(); }
    }
  }
  function haloText(ctx, text, x, y, color, font, align, base) {
    ctx.save(); ctx.font = font; ctx.textAlign = align || 'center'; ctx.textBaseline = base || 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = 4; ctx.strokeStyle = css('--map'); ctx.strokeText(text, x, y); ctx.fillStyle = color; ctx.fillText(text, x, y); ctx.restore();
  }
  function cloudPuffs(ctx, x, y, w, h, alpha) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = css('--cloud'); ctx.strokeStyle = css('--muted'); ctx.lineWidth = 1.2;
    const n = Math.max(3, Math.round(w / 14));
    for (let i = 0; i < n; i++) { const px = x - w / 2 + (i + 0.5) * w / n, r = h * (0.35 + 0.25 * Math.abs(Math.sin(i * 2.3 + x))); ctx.beginPath(); ctx.arc(px, y + h * 0.1 - r * 0.2, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    ctx.restore();
  }
  const dot = (ctx, x, y, r, color) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };

  // ---------- 3章：飽和水蒸気量（教科書の値、docs/reference/suijoki.md） ----------
  const SAT = [4.8, 5.2, 5.6, 6.0, 6.4, 6.8, 7.3, 7.8, 8.3, 8.8, 9.4, 10.0, 10.7, 11.4, 12.1, 12.8, 13.6, 14.5, 15.4, 16.3, 17.3, 18.3, 19.4, 20.6, 21.8, 23.1, 24.4, 25.8, 27.2, 28.8, 30.4, 32.1, 33.8, 35.7, 37.6, 39.6, 41.7, 43.9, 46.2, 48.6, 51.1];
  function sat(T) { T = Math.max(0, Math.min(40, T)); const i = Math.floor(T), f = T - i; return i >= 40 ? SAT[40] : SAT[i] + (SAT[i + 1] - SAT[i]) * f; }
  function dewPoint(e) { if (e <= SAT[0]) return 0; for (let i = 0; i < 40; i++) if (e <= SAT[i + 1]) return i + (e - SAT[i]) / (SAT[i + 1] - SAT[i]); return 40; }
  // 1章：湿度表 HUM[乾球℃][示度の差℃] の 18〜23 ℃ の行（乾湿計の式から計算した値、docs/reference/kanshitsukei.md）
  const HUM = { 18: [100, 90, 80, 71, 62, 53], 19: [100, 90, 81, 72, 63, 54], 20: [100, 91, 81, 72, 64, 56], 21: [100, 91, 82, 73, 65, 57], 22: [100, 91, 82, 74, 66, 58], 23: [100, 91, 83, 75, 67, 59] };
  const satTable = (no) => `<div class="tblwrap"><p>表${no}　気温と飽和水蒸気量〔g/m³〕</p><table class="qt"><tr><th class="corner">気温〔℃〕</th>${Array.from({ length: 10 }, (_, k) => `<th>${k}</th>`).join('')}</tr>` +
    [0, 10, 20, 30].map(d => `<tr><th>${d}〜</th>${Array.from({ length: 10 }, (_, k) => `<td>${d + k <= 35 ? SAT[d + k].toFixed(1) : ''}</td>`).join('')}</tr>`).join('') + '</table></div>';

  // ---------- 大問1：3日間の観測記録（3時間ごと、t = 0〜72 h） ----------
  // 湿度は「水蒸気量 ÷ 飽和水蒸気量」で計算する（3章のモデル）。1日目は晴れ、2日目は低気圧が通って雨、3日目は寒気が入って晴れ。
  const D1 = (() => {

          focus: ['g5', 'P'] },
        { q: '山頂での空気の温度は何 ℃ か。',
          choices: [`${T5 - PEAK5 / 100} ℃`, `${TPEAK5 - 3} ℃`, `${TPEAK5} ℃`, `${TD5} ℃`], answer: 2,
          explain: `P（${HC5} m）までは 100 m につき 1 ℃ 下がって ${TD5} ℃。P から山頂までの ${PEAK5 - HC5} m は雲の中なので 100 m につき 0.5 ℃ 下がり、${TD5} − 0.5 × ${(PEAK5 - HC5) / 100} ＝ ${TPEAK5} ℃。山頂まで 1 ℃ ずつ下げて ${T5 - PEAK5 / 100} ℃ とするまちがいが多い。`,
          focus: ['g5', 'peak'] },
        { q: '空気が A から山頂まで上昇する間に、空気 1 m³ あたり何 g の水蒸気が水滴になったか。',
          choices: [`${f1(DROP5)} g`, `${f1(EPEAK5)} g`, `${f1(E5)} g`, `${f1(E5 + EPEAK5)} g`], answer: 0,
          explain: `山頂（${TPEAK5} ℃）の空気は飽和しているので、ふくむ水蒸気は表4 の ${TPEAK5} ℃ の飽和水蒸気量 ${EPEAK5.toFixed(1)} g/m³。はじめの ${E5.toFixed(1)} g との差 ${E5.toFixed(1)} − ${EPEAK5.toFixed(1)} ＝ ${f1(DROP5)} g が水滴になり、雲や雨として風上側に残った。` },
        { q: '地点 B に下りた空気の気温と湿度の組み合わせとして、最も適当なものはどれか。',
          choices: [`${T5} ℃・約 ${Math.round(RHA5)} %（地点 A と同じ）`, `${TPEAK5} ℃・100 %`, `${TB5} ℃・約 ${Math.round(E5 / sat(TB5) * 100)} %`, `${TB5} ℃・約 ${Math.round(RHB5)} %`], answer: 3,
          explain: `山頂から ${PEAK5} m 下りる間に 100 m につき 1 ℃ 上がるので、${TPEAK5} ＋ ${PEAK5 / 100} ＝ ${TB5} ℃。水蒸気量は山頂と同じ ${EPEAK5.toFixed(1)} g/m³（水滴として失った分はもどらない）なので、湿度は ${EPEAK5.toFixed(1)} ÷ ${sat(TB5).toFixed(1)} × 100 ≒ ${Math.round(RHB5)} %。A より高温で乾いた空気になる（フェーン現象）。冬の季節風が日本海側に雪を降らせ、太平洋側が晴れて乾燥するのも同じしくみ（5章）。`,
          model: '風上側で雲ができて水蒸気が水滴として失われ、下りるときは雲ができずに 100 m につき 1 ℃ ずつ温度が上がるので、B では A より気温が高く、湿度が低い。',
          focus: ['g5', 'B'] }
      ] }
  ];

  // ---------- 描画とふるまい ----------
  const picked = DAIMON.map(d => d.qs.map(() => null));
  const root = document.getElementById('daimon'), board = document.getElementById('board');
  const chLink = (n) => { const [name, href] = CH[n]; return `<a href="${href}">${n}章「${name}」</a>`; };
  root.innerHTML = DAIMON.map((d, i) => `<section class="daimon" id="d${i + 1}" aria-labelledby="d${i + 1}-h">
    <h2 id="d${i + 1}-h"><span class="num">大問${i + 1}</span>${d.title}<small>${d.ch.map(n => n + '章').join('・')}</small></h2>
    <p class="lead">${d.lead}</p>${d.figs}${d.tables() ? `<div class="tables">${d.tables()}</div>` : ''}
    <ol class="qs" data-d="${i}"></ol>
    <div class="dfoot"><span>得点 <span class="score" id="s${i}"></span></span><span>この図を動かして確かめる → ${d.ch.map(chLink).join('・')}</span><button type="button" class="qbtn retry" data-retry="${i}">やり直す</button></div>
  </section>`).join('');

  function renderQs(i) {
    const d = DAIMON[i], el = root.querySelector(`ol.qs[data-d="${i}"]`);
    el.innerHTML = d.qs.map((q, j) => {
      const p = picked[i][j], long = q.choices.some(c => c.length > 22);
      const choices = q.choices.map((c, k) => { const mark = p === null ? '' : k === q.answer ? 'ok' : k === p ? 'ng' : ''; return `<button type="button" data-pick="${i}:${j}:${k}" data-mark="${mark}"${p === null ? '' : ' disabled'}>${q.noKey ? '' : `<span class="k">${KEYS[k]}</span>`}<span>${c}</span></button>`; }).join('');
      const ex = p === null ? '' : `<div class="explain"><div class="verdict ${p === q.answer ? 'ok' : 'ng'}">${p === q.answer ? '正解' : `ちがう。正解は ${KEYS[q.answer]}`}</div><div><strong>考え方：</strong>${q.explain}</div>${q.model ? `<div class="model"><strong>記述で答えるなら：</strong>${q.model}</div>` : ''}${q.focus ? `<button type="button" class="qbtn focus" data-focus="${i}:${j}">図で確かめる</button>` : ''}</div>`;
      return `<li class="sq"><div class="q"><span class="qn">(${j + 1})</span>${q.q}</div><div class="choices${long ? ' long' : ''}" role="group" aria-label="(${j + 1}) の選択肢">${choices}</div>${ex}</li>`;
    }).join('');
  }
  const scoreOf = (i) => picked[i].filter((p, j) => p === DAIMON[i].qs[j].answer).length;
  function renderBoard() {
    const total = DAIMON.reduce((s, d, i) => s + scoreOf(i), 0), n = DAIMON.reduce((s, d) => s + d.qs.length, 0);
    board.innerHTML = `<tr><th>大問</th><th>内容</th><th style="text-align:right">得点</th></tr>` +
      DAIMON.map((d, i) => `<tr><td class="n">${i + 1}</td><td><a href="#d${i + 1}">${d.title}</a></td><td class="s">${scoreOf(i)} / ${d.qs.length}</td></tr>`).join('') +
      `<tr class="total"><td></td><td>合計</td><td class="s">${total} / ${n}</td></tr>`;
    DAIMON.forEach((d, i) => { document.getElementById('s' + i).textContent = `${scoreOf(i)} / ${d.qs.length}（${picked[i].filter(p => p !== null).length} 問解答）`; });
  }
  function clearFocus(i) { if (focus && (i === undefined || focus.d === i)) { const id = focus.fig; focus = null; renderFig(id); } }
  root.addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.pick) { const [i, j, k] = b.dataset.pick.split(':').map(Number); picked[i][j] = k; renderQs(i); renderBoard(); }
    else if (b.dataset.retry !== undefined) { const i = +b.dataset.retry; picked[i] = picked[i].map(() => null); clearFocus(i); renderQs(i); renderBoard(); }
    else if (b.dataset.focus) {
      const [i, j] = b.dataset.focus.split(':').map(Number), [fig, key] = DAIMON[i].qs[j].focus, prev = focus && focus.fig;
      focus = { fig, key, d: i }; if (prev && prev !== fig) renderFig(prev); renderFig(fig);
      FIGS[fig].cv.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' });
    }
  });
  document.getElementById('retry-all').addEventListener('click', () => { picked.forEach((p, i) => { picked[i] = p.map(() => null); renderQs(i); }); clearFocus(); renderBoard(); });

  document.getElementById('crumbs').innerHTML = NAV.map(([label, href]) => href ? `<a href="${href}">${label}</a>` : `<span>${label}</span>`).join('');
  DAIMON.forEach((d, i) => renderQs(i));
  renderBoard();
  setupFigs();
  renderAllFigs();
  let lastW = innerWidth;
  addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; renderAllFigs(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAllFigs);
  if (document.fonts) document.fonts.ready.then(renderAllFigs);
})();
</script>
